<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Verda — a calming green note-taking & productivity space. Notes, tasks, and focus, beautifully organized." />
  <meta name="theme-color" content="#3f7d6b" />
  <title>Verdа · calm notes & productivity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">🌿</div>
        <div class="brand-text">
          <span class="brand-name">Verdа</span>
          <span class="brand-tag">calm &amp; focused</span>
        </div>
      </div>

      <button class="new-note-btn" id="newNoteBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11 11V5a1 1 0 1 1 2 0v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6Z"/></svg>
        New note
      </button>

      <nav class="nav" id="nav">
        <button class="nav-item is-active" data-view="all">
          <span class="nav-ico">🗂️</span><span>All notes</span><span class="nav-count" data-count="all"></span>
        </button>
        <button class="nav-item" data-view="favorites">
          <span class="nav-ico">⭐</span><span>Favorites</span><span class="nav-count" data-count="favorites"></span>
        </button>
        <button class="nav-item" data-view="tasks">
          <span class="nav-ico">✅</span><span>Tasks</span><span class="nav-count" data-count="tasks"></span>
        </button>
        <button class="nav-item" data-view="trash">
          <span class="nav-ico">🗑️</span><span>Trash</span><span class="nav-count" data-count="trash"></span>
        </button>
      </nav>

      <div class="nav-section">
        <div class="nav-section-head">
          <span>Tags</span>
        </div>
        <div class="tag-list" id="tagList"></div>
      </div>

      <div class="sidebar-footer">
        <button class="ghost-btn" id="themeToggle" title="Toggle theme">
          <span class="ico-light">☀️</span><span class="ico-dark">🌙</span>
          <span class="theme-label">Theme</span>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" title="Menu" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z"/></svg>
        </button>
        <div class="search">
          <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="m21 20-4.3-4.3a8 8 0 1 0-1.4 1.4L20 21zM4 10a6 6 0 1 1 12 0 6 6 0 0 1-12 0Z"/></svg>
          <input type="text" id="search" placeholder="Search notes, tasks, tags…" autocomplete="off" />
          <kbd class="search-kbd">/</kbd>
        </div>
        <div class="topbar-right">
          <div class="seg" id="layoutSeg" role="tablist" aria-label="Layout">
            <button class="seg-btn is-active" data-layout="masonry" title="Board view" aria-label="Board view">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 4h7v9H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 15h7v5H4z"/></svg>
            </button>
            <button class="seg-btn" data-layout="list" title="List view" aria-label="List view">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 5h16v3H4zM4 10.5h16v3H4zM4 16h16v3H4z"/></svg>
            </button>
          </div>
        </div>
      </header>

      <section class="view-head">
        <div>
          <h1 class="view-title" id="viewTitle">All notes</h1>
          <p class="view-sub" id="viewSub">Your calm little corner of thoughts.</p>
        </div>
      </section>

      <section class="board-wrap">
        <div class="board" id="board" data-layout="masonry"></div>
        <div class="empty" id="empty" hidden>
          <div class="empty-art">🍃</div>
          <h2 id="emptyTitle">Nothing here yet</h2>
          <p id="emptyText">Plant your first thought. It’ll grow.</p>
          <button class="new-note-btn ghost" id="emptyNew">Create a note</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Editor overlay -->
  <div class="editor-overlay" id="editorOverlay" hidden>
    <div class="editor-scrim" data-close></div>
    <div class="editor" id="editor" role="dialog" aria-modal="true" aria-label="Note editor">
      <div class="editor-top">
        <div class="swatches" id="swatches" aria-label="Note color"></div>
        <div class="editor-actions">
          <button class="icon-btn" id="pinBtn" title="Pin / favorite">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="m12 2 2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>
          </button>
          <button class="icon-btn" id="taskToggleBtn" title="Mark as task / checklist">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          </button>
          <button class="icon-btn danger" id="deleteBtn" title="Delete note">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 7h12l-1 13H7zM9 4h6l1 2H8z"/></svg>
          </button>
          <button class="icon-btn" id="closeEditor" title="Close" data-close>
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
          </button>
        </div>
      </div>

      <input class="editor-title" id="editorTitle" placeholder="Title" />

      <div class="editor-body" id="editorBody">
        <textarea class="editor-text" id="editorText" placeholder="Start writing… let your thoughts breathe."></textarea>
        <div class="checklist" id="checklist" hidden></div>
      </div>

      <div class="editor-foot">
        <div class="tag-edit">
          <span class="tag-edit-chips" id="tagChips"></span>
          <input class="tag-input" id="tagInput" placeholder="+ tag" />
        </div>
        <span class="editor-meta" id="editorMeta"></span>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastAction"></button></div>

  <script src="app.js"></script>
</body>
</html>
